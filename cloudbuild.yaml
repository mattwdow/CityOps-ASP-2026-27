steps:
  # 1. Build the Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/cityops-asp-2026-27:$COMMIT_SHA', '.']

  # 2. Push the container image to Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/cityops-asp-2026-27:$COMMIT_SHA']

  # 3. Deploy to Cloud Run in us-west1
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'cityops-asp-2026-27'
      - '--image'
      - 'gcr.io/$PROJECT_ID/cityops-asp-2026-27:$COMMIT_SHA'
      - '--region'
      - 'us-west1'
      - '--port'
      - '8080'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'gcr.io/$PROJECT_ID/cityops-asp-2026-27:$COMMIT_SHA'
